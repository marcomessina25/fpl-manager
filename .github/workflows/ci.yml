name: CI

on:
  push:
    branches: [ master, v09, version_10, v10, v115, v12, v125, v13, v147 ]
  pull_request:
    branches: [ master, v09, version_10, v10, v115, v12, v125, v13 ]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Syntax and static import check
        run: |
          python -m compileall -q src tests

      - name: Run unit, integration, and historical regression test suite
        run: |
          python -m pytest -v

      - name: Run CLI smoke check
        run: |
          python -m fpl_manager.cli --help
          fpl --help

      - name: Build and install candidate wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist --quiet
          python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',*glob.glob('dist/*.whl')])"

      - name: Smoke installed artifact outside checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/scripts/smoke_installed.py"
