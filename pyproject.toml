[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fpl-manager"
version = "0.5.0-dev"
description = "A deterministic, local-first Fantasy Premier League decision engine."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "marcomessina25" }]
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
fpl = "fpl_manager.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_manager"]
