[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fpl-manager"
version = "1.1.5"
description = "A deterministic, local-first Fantasy Premier League decision engine."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "marcomessina25" }]
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]
ml = [
    "scikit-learn>=1.4,<1.7",
    "numpy>=1.26,<2.3",
]

[project.scripts]
fpl = "fpl_manager.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_manager"]
